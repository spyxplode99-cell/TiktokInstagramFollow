              # -- infra
              def log(self, msg):
                  self.q.put(msg)

              def _drain(self):
                  while True:
                      try:
                          msg = self.q.get_nowait()
                      except queue.Empty:
                          break
                      stamp = time.strftime("%H:%M:%S")
                      self.log_box.configure(state="normal")
                      self.log_box.insert("end", "[%s] %s\n" % (stamp, msg))
                      self.log_box.see("end")
                      self.log_box.configure(state="disabled")
                  self.v_stat.set("Acciones: %d | Estado: %s" % (
                      self.counter, "detenido" if self.stop_flag.is_set() else "activo"))
                  self.after(120, self._drain)

              def _clear_log(self):
                  self.log_box.configure(state="normal")
                  self.log_box.delete("1.0", "end")
                  self.log_box.configure(state="disabled")

              def _send_code(self):
                  self.code_event.set()

              def _num(self, entry, default, cast=float):
                  try:
                      return cast(entry.get())
                  except Exception:
                      return default

              def _read_cfg(self):
                  self.cfg.update({
                      "delay_min": self._num(self.e_delay_min, DEFAULT_CFG["delay_min"]),
                      "delay_max": self._num(self.e_delay_max, DEFAULT_CFG["delay_max"]),
                      "max_follows": self._num(self.e_max, DEFAULT_CFG["max_follows"], int),
                      "break_every": self._num(self.e_break_every, DEFAULT_CFG["break_every"], int),
                      "break_seconds": self._num(self.e_break_seconds, DEFAULT_CFG["break_seconds"], int),
                      "do_like": self.v_like.get(),
                      "headless": self.v_head.get(),
                      "u_delay_min": self._num(self.e_u_delay_min, DEFAULT_CFG["u_delay_min"]),
                      "u_delay_max": self._num(self.e_u_delay_max, DEFAULT_CFG["u_delay_max"]),
                      "u_max": self._num(self.e_umax, DEFAULT_CFG["u_max"], int),
                      "nonmutual_only": self.v_nonmutual.get(),
                      "cantidad": self._num(self.e_cant, DEFAULT_CFG["cantidad"], int),
                  })
                  save_cfg(self.cfg)
                  return self.cfg

              def _lines(self, widget):
                  return [t.strip() for t in widget.get("1.0", "end").splitlines() if t.strip()]

              def _guard(self):
                  if self.worker and self.worker.is_alive():
                      messagebox.showinfo("En curso", "Ya hay un proceso activo.")
                      return False
                  return True

              # -- acciones
              def on_login(self):
                  plat = self.cb_platform.get()
                  try:
                      if self.drv is not None:
                          self.drv.quit()
                  except Exception:
                      pass
                  self.log("Abriendo navegador... inicia sesion manualmente.")
                  try:
                      self.drv = new_driver(plat, False)
                      self.drv.get(LOGIN_URL[plat])
                  except Exception:
                      self.log("ERROR: " + traceback.format_exc(limit=2))

              def on_close_browser(self):
                  try:
                      if self.drv is not None:
                          self.drv.quit()
                          self.drv = None
                          self.log("Navegador cerrado. Sesion guardada.")
                  except Exception:
                      self.log("ERROR: " + traceback.format_exc(limit=2))

              def on_stop(self):
                  self.stop_flag.set()
                  self.resume_flag.set()
                  self.code_event.set()
                  self.log("Detencion solicitada...")

              def on_run(self):
                  if not self._guard():
                      return
                  cfg = self._read_cfg()
                  plat = self.cb_platform.get()
                  mode = "cuenta" if self.cb_mode.get() == "cuenta objetivo" else "hashtag"
                  targets = self._lines(self.txt_targets)
                  if not targets:
                      messagebox.showwarning("Sin objetivos", "Escribe al menos un hashtag o cuenta.")
                      return
                  self.stop_flag.clear()
                  self.counter = 0

                  def bump(inc=0):
                      self.counter += inc
                      return self.counter

                  def job():
                      try:
                          run_followers(plat, mode, targets, cfg, self.log, self.stop_flag, bump)
                          self.log("== Proceso finalizado. Total: %d" % self.counter)
                      except Exception:
                          self.log("ERROR: " + traceback.format_exc(limit=3))

                  self.worker = threading.Thread(target=job, daemon=True)
                  self.worker.start()

              def on_unfollow(self):
                  if not self._guard():
                      return
                  cfg = self._read_cfg()
                  plat = self.cb_uplat.get()
                  mode = "lista" if self.cb_umode.get() == "lista manual" else "masivo"
                  targets = self._lines(self.txt_ulist)
                  whitelist = set(n.lstrip("@").lower()
                                  for n in re.split(r"[\n,;]+", self.txt_white.get("1.0", "end")) if n.strip())
                  username = self.e_me.get().strip().lstrip("@")
                  if mode == "lista" and not targets:
                      messagebox.showwarning("Sin lista", "Agrega usuarios a la lista manual.")
                      return
                  if mode == "masivo" and not username:
                      messagebox.showwarning("Falta usuario", "Indica tu usuario.")
                      return
                  self.stop_flag.clear()
                  self.counter = 0

                  def bump(inc=0):
                      self.counter += inc
                      return self.counter

                  def job():
                      try:
                          run_unfollow(plat, username, mode, targets, whitelist, cfg,
                                       self.log, self.stop_flag, bump)
                          self.log("== Unfollow finalizado. Total: %d" % self.counter)
                      except Exception:
                          self.log("ERROR: " + traceback.format_exc(limit=3))

                  self.worker = threading.Thread(target=job, daemon=True)
                  self.worker.start()

              def on_create(self):
                  if not self._guard():
                      return
                  cfg = self._read_cfg()
                  plat = self.cb_cplat.get()
                  modo = self.cb_cmail.get()
                  modo = ("temporal" if modo.startswith("temporal")
                          else "lista" if modo == "lista propia" else "manual")
                  lista = self._lines(self.txt_accounts)
                  if modo == "lista" and not lista:
                      messagebox.showwarning("Sin correos", "Agrega la lista propia.")
                      return
                  self.stop_flag.clear()
                  self.counter = 0
                  for i in self.tv.get_children():
                      self.tv.delete(i)

                  def pausa_captcha():
                      self.resume_flag.clear()
                      self.resume_flag.wait(900)

                  def pedir_codigo(modo="codigo"):
                      if modo == "email":
                          self.code_event.clear()
                          self.log("   >> Escribe el correo en el campo y pulsa ENVIAR CODIGO.")
                          self.code_event.wait(600)
                          self.code_event.clear()
                          return self.code_value.get().strip()
                      self.code_event.clear()
                      self.log("   >> Esperando codigo de verificacion...")
                      self.code_event.wait(600)
                      self.code_event.clear()
                      return self.code_value.get().strip()

                  def on_fila(email, usuario, estado):
                      self.tv.insert("", "end", values=(email, usuario, estado))

                  def job():
                      try:
                          run_creacion(plat, modo, max(1, cfg["cantidad"]), lista, self.log,
                                       self.stop_flag, pausa_captcha, pedir_codigo, on_fila)
                      except Exception:
                          self.log("ERROR: " + traceback.format_exc(limit=3))

                  self.worker = threading.Thread(target=job, daemon=True)
                  self.worker.start()

              def _on_close(self):
                  self.stop_flag.set()
                  self.resume_flag.set()
                  self.code_event.set()
                  try:
                      if self.drv is not None:
                          self.drv.quit()
                  except Exception:
                      pass
                  self.destroy()


          if __name__ == "__main__":
              App().mainloop()
          PYEOF

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium pyinstaller

      - name: Compilar EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name SocialBoost ^
            --collect-all selenium ^
            --hidden-import selenium.webdriver.chrome.service ^
            app.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SocialBoost-Windows
          path: dist/SocialBoost.exe
          retention-days: 30

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SocialBoost.exe
